[supervisord]
nodaemon=true
loglevel=info
logfile=/tmp/supervisor/supervisord.log
pidfile=/tmp/supervisor/supervisord.pid
childlogdir=/tmp/supervisor

[program:xvfb]
command=/bin/bash -lc "rm -f /tmp/.X99-lock; Xvfb :99 -screen 0 1280x720x24"
autostart=true
autorestart=true
startsecs=2
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=/bin/bash -lc "sleep 2; DISPLAY=:99 openbox --sm-disable"
autostart=true
autorestart=true
startsecs=2
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/bin/bash -lc "sleep 3; x11vnc -display :99 -forever -shared -nopw -listen 0.0.0.0 -rfbport ${VNC_PORT:-5900}"
autostart=true
autorestart=true
startsecs=2
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/bin/bash -lc "sleep 4; /usr/share/novnc/utils/novnc_proxy --vnc 127.0.0.1:${VNC_PORT:-5900} --listen 0.0.0.0:${NOVNC_PORT:-6080}"
autostart=true
autorestart=true
startsecs=2
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bootstrap]
command=/bin/bash -lc "/opt/mt5-redesign/bootstrap.sh"
autostart=true
autorestart=false
startsecs=0
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:terminal]
command=/bin/bash -lc "/opt/mt5-redesign/scripts/launch-terminal.sh"
autostart=true
autorestart=true
startsecs=5
priority=6
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dismiss]
command=/bin/bash -lc "/opt/mt5-redesign/scripts/dialog-dismiss.sh"
autostart=true
autorestart=true
startsecs=2
priority=7
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mt5linux]
command=/bin/bash -lc "/opt/mt5-redesign/scripts/start-mt5linux.sh"
autostart=true
autorestart=true
startsecs=5
priority=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
