name: MT5 Bridge Redesign (manual)

on:
  workflow_dispatch:
    inputs:
      mt5_url:
        description: "Pinned MT5 setup.exe or portable zip URL"
        required: false
        default: "https://github.com/loriloha/adaptive-trading-bot/releases/download/mt5-portable-5005817/mt5-portable.zip"
      wine_base:
        description: "Wine base image tag"
        required: false
        default: "scottyhardy/docker-wine:latest"
      no_cache:
        description: "Disable Docker layer cache (true/false)"
        required: false
        default: "true"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mt5-bridge-base

jobs:
  redesign-build-and-push:
    name: Build redesign candidate image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log redesign workflow identity
        shell: bash
        run: |
          set -euo pipefail
          echo "=== MT5 REDESIGN WORKFLOW ==="
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "Run Attempt: ${GITHUB_RUN_ATTEMPT}"
          echo "Ref: ${GITHUB_REF}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download installers to build context
        env:
          MT5_URL: ${{ github.event.inputs.mt5_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eux
          PYTHON_URL="https://www.python.org/ftp/python/3.9.13/python-3.9.13-amd64.exe"
          echo "Downloading Windows Python installer..."
          curl -fsSL --retry 5 --retry-delay 5 --max-time 300 \
            "${PYTHON_URL}" -o ./mt5-bridge-base/python-installer.exe

          if [ -n "${MT5_URL}" ]; then
            echo "Downloading MT5 setup..."
            if echo "${MT5_URL}" | grep -qE '^https://github\.com/.+/releases/download/'; then
              OWNER="$(echo "${MT5_URL}" | cut -d/ -f4)"
              REPO="$(echo "${MT5_URL}"  | cut -d/ -f5)"
              TAG="$(echo "${MT5_URL}"   | cut -d/ -f8)"
              ASSET="$(echo "${MT5_URL}" | cut -d/ -f9-)"
              API_JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${TAG}")"
              ASSET_ID="$(echo "${API_JSON}" | jq -r --arg name "${ASSET}" '.assets[] | select(.name == $name) | .id')"
              test -n "${ASSET_ID}"
              curl -fsSL --retry 5 --retry-delay 5 --max-time 600 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${OWNER}/${REPO}/releases/assets/${ASSET_ID}" \
                -o ./mt5-bridge-base/mt5setup.exe
            else
              curl -fsSL --retry 5 --retry-delay 5 --max-time 600 \
                "${MT5_URL}" -o ./mt5-bridge-base/mt5setup.exe
            fi
          else
            echo "MT5_URL empty - creating placeholder"
            touch ./mt5-bridge-base/mt5setup.exe
          fi

      - name: Build redesign candidate image
        id: build_candidate
        uses: docker/build-push-action@v5
        with:
          context: ./mt5-bridge-base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:redesign-candidate-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:redesign-latest
          build-args: |
            HAS_MT5=true
            WINE_BASE=${{ github.event.inputs.wine_base }}
            CACHE_BUST=${{ github.run_id }}
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test redesign candidate image
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:redesign-candidate-${{ github.sha }}"
          docker pull "${CANDIDATE}"
          docker run --rm --entrypoint bash "${CANDIDATE}" /bridge/smoke-test-ipc.sh
