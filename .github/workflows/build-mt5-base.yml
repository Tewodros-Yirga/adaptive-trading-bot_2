name: Build & Push MT5 Bridge Base Image

on:
  push:
    branches: [main]
    paths:
      - "mt5-bridge-base/Dockerfile"
  # Rebuild monthly to keep the baked-in MT5 terminal version current.
  # A stale terminal triggers a blocking "Restart to install updates" dialog
  # on every container start, which prevents IPC pipe creation.
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      mt5_url:
        description: "MT5 setup.exe URL (leave empty to skip terminal install)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mt5-bridge-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The build takes ~30-45 min due to Wine + Python installs.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Pre-download installers on the runner (fast internet) so Dockerfile can
      # COPY them in — avoids slow/broken apt mirrors inside Docker on GHA runners.
      - name: Download installers to build context
        run: |
          set -eux
          PYTHON_URL="https://www.python.org/ftp/python/3.9.13/python-3.9.13-amd64.exe"
          MT5_URL="${{ github.event.inputs.mt5_url || secrets.MT5_INSTALLER_URL || '' }}"

          echo "Downloading Windows Python installer..."
          curl -fsSL --retry 5 --retry-delay 5 --max-time 300 \
            "${PYTHON_URL}" -o ./mt5-bridge-base/python-installer.exe
          echo "Python installer: $(du -sh ./mt5-bridge-base/python-installer.exe)"

          if [ -n "${MT5_URL}" ]; then
            echo "Downloading MT5 setup..."
            curl -fsSL --retry 5 --retry-delay 5 --max-time 600 \
              "${MT5_URL}" -o ./mt5-bridge-base/mt5setup.exe
            echo "MT5 setup: $(du -sh ./mt5-bridge-base/mt5setup.exe)"
          else
            echo "MT5_URL not set — creating empty placeholder"
            touch ./mt5-bridge-base/mt5setup.exe
          fi

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: ./mt5-bridge-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HAS_MT5=${{ github.event.inputs.mt5_url != '' || 'false' }}
          # Cache layers in GitHub's cache for faster rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
