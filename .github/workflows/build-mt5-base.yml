name: Build & Push MT5 Bridge Base Image

on:
  push:
    branches: [main]
    paths:
      - "mt5-bridge-base/Dockerfile"
      - "mt5-bridge-base/smoke-test-ipc.sh"
  # Rebuild monthly to keep the baked-in MT5 terminal version current.
  # A stale terminal triggers a blocking "Restart to install updates" dialog
  # on every container start, which prevents IPC pipe creation.
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      mt5_url:
        description: "MT5 setup.exe URL (leave empty to skip terminal install)"
        required: false
        default: ""
      wine_base:
        description: "Wine base image tag (e.g. scottyhardy/docker-wine:latest)"
        required: false
        default: "scottyhardy/docker-wine:latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mt5-bridge-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The build takes ~30-45 min due to Wine + Python installs.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build mode (slim vs baked)
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          INPUT_URL="${{ github.event.inputs.mt5_url || '' }}"
          INPUT_WINE_BASE="${{ github.event.inputs.wine_base || '' }}"
          SECRET_URL="${{ secrets.MT5_INSTALLER_URL || '' }}"

          # We only bake MT5 into the image on schedule/manual runs.
          # Push builds must NEVER overwrite the baked `latest` tag.
          HAS_MT5="false"
          MT5_URL=""
          WINE_BASE="scottyhardy/docker-wine:latest"
          PUBLISH_LATEST="false"
          PUBLISH_SLIM="false"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "schedule" ]]; then
            MT5_URL="${INPUT_URL:-${SECRET_URL}}"
            if [[ -n "${INPUT_WINE_BASE}" ]]; then
              WINE_BASE="${INPUT_WINE_BASE}"
            fi
            if [[ -n "${MT5_URL}" ]]; then
              HAS_MT5="true"
              PUBLISH_LATEST="true"
            fi
          fi

          if [[ "${EVENT_NAME}" == "push" ]]; then
            PUBLISH_SLIM="true"
          fi

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          PROMOTE_TAGS=()
          # Always publish a sha tag for traceability.
          PROMOTE_TAGS+=("${IMAGE}:sha-${{ github.sha }}")
          if [[ "${PUBLISH_SLIM}" == "true" ]]; then
            PROMOTE_TAGS+=("${IMAGE}:slim")
          fi
          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            PROMOTE_TAGS+=("${IMAGE}:latest")
          fi
          CANDIDATE_TAG="${IMAGE}:candidate-${{ github.sha }}"

          echo "event_name=${EVENT_NAME}"
          echo "has_mt5=${HAS_MT5}"
          echo "publish_slim=${PUBLISH_SLIM}"
          echo "publish_latest=${PUBLISH_LATEST}"
          echo "wine_base=${WINE_BASE}"
          echo "mt5_url_present=$([[ -n "${MT5_URL}" ]] && echo true || echo false)"
          echo "candidate_tag=${CANDIDATE_TAG}"

          {
            echo "has_mt5=${HAS_MT5}"
            echo "mt5_url=${MT5_URL}"
            echo "wine_base=${WINE_BASE}"
            echo "candidate_tag=${CANDIDATE_TAG}"
            echo "promote_tags<<EOF"
            printf "%s\n" "${PROMOTE_TAGS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pre-download installers on the runner (fast internet) so Dockerfile can
      # COPY them in — avoids slow/broken apt mirrors inside Docker on GHA runners.
      - name: Download installers to build context
        env:
          MT5_URL: ${{ steps.mode.outputs.mt5_url }}
        run: |
          set -eux
          PYTHON_URL="https://www.python.org/ftp/python/3.9.13/python-3.9.13-amd64.exe"

          echo "Downloading Windows Python installer..."
          curl -fsSL --retry 5 --retry-delay 5 --max-time 300 \
            "${PYTHON_URL}" -o ./mt5-bridge-base/python-installer.exe
          echo "Python installer: $(du -sh ./mt5-bridge-base/python-installer.exe)"

          if [ -n "${MT5_URL}" ]; then
            echo "Downloading MT5 setup..."
            curl -fsSL --retry 5 --retry-delay 5 --max-time 600 \
              "${MT5_URL}" -o ./mt5-bridge-base/mt5setup.exe
            echo "MT5 setup: $(du -sh ./mt5-bridge-base/mt5setup.exe)"
          else
            echo "MT5_URL not set — creating empty placeholder"
            touch ./mt5-bridge-base/mt5setup.exe
          fi

      - name: Build candidate base image
        id: build_candidate
        uses: docker/build-push-action@v5
        with:
          context: ./mt5-bridge-base
          push: true
          tags: ${{ steps.mode.outputs.candidate_tag }}
          build-args: |
            HAS_MT5=${{ steps.mode.outputs.has_mt5 }}
            WINE_BASE=${{ steps.mode.outputs.wine_base }}
          # Cache layers in GitHub's cache for faster rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test candidate image (IPC attach gate)
        if: steps.mode.outputs.has_mt5 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="${{ steps.mode.outputs.candidate_tag }}"
          echo "Pulling candidate image: ${CANDIDATE}"
          docker pull "${CANDIDATE}"
          echo "Running IPC smoke test..."
          docker run --rm --entrypoint bash "${CANDIDATE}" /bridge/smoke-test-ipc.sh

      - name: Promote candidate tags after smoke test
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          DIGEST="${{ steps.build_candidate.outputs.digest }}"
          SOURCE_REF="${IMAGE}@${DIGEST}"
          while IFS= read -r TARGET_TAG; do
            [[ -z "${TARGET_TAG}" ]] && continue
            echo "Promoting ${SOURCE_REF} -> ${TARGET_TAG}"
            docker buildx imagetools create --tag "${TARGET_TAG}" "${SOURCE_REF}"
          done <<< "${{ steps.mode.outputs.promote_tags }}"
