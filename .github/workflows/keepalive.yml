# Keep Hugging Face Space awake by pinging it on a schedule.
# Configure in *this* GitHub repo (Settings → Secrets and variables → Actions).
#
# Secrets:
#   HF_SPACE_URL      — REQUIRED. Space runtime base URL with no path, e.g.
#                       https://YOURNAME-YOURSPACENAME.hf.space
#                       (copy from the Space page when it is running, or Embed / API docs.)
#   HF_TOKEN          — Optional. HF API token with read access to the Space if it is private.
#   MT_BRIDGE_SECRET  — Optional. Same value as MT_BRIDGE_SECRET on the Space; enables /debug/mt5 log lines.
#
# If you see HTTP 404 and HTML mentioning Hugging Face, the hostname is wrong or the Space is
# private without HF_TOKEN — not a cold start.
#
# Scheduled workflows only run on the repository default branch.
name: Keep MT5 Bridge Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MT_BRIDGE_SECRET: ${{ secrets.MT_BRIDGE_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${HF_SPACE_URL:-}" ]; then
            echo "::error::Set the HF_SPACE_URL repository secret to your Space base URL (https://… .hf.space with no trailing path). A wrong or missing URL returns Hugging Face HTML 404, not your app."
            exit 1
          fi

          BASE_URL="${HF_SPACE_URL%/}"
          HEALTH_URL="${BASE_URL}/health"
          ROOT_URL="${BASE_URL}/"
          DEBUG_URL="${BASE_URL}/debug/mt5"

          is_hf_gateway_html() {
            local f="$1"
            test -f "$f" && head -c 500 "$f" | grep -q '<!DOCTYPE html' && grep -q 'huggingface' "$f" 2>/dev/null
          }

          warn_hf_404() {
            local code="$1" file="$2"
            if [ "${code}" = "404" ] && is_hf_gateway_html "${file}"; then
              echo "::warning::Response is Hugging Face's HTML 404 (not your Space app). Fix HF_SPACE_URL to your live Space URL, or if the Space is private set HF_TOKEN."
            fi
          }

          # curl: write body to $1, print http code on stdout
          space_get() {
            local out="$1" max="$2" url="$3"
            local -a c=(curl -sS -o "${out}" -w "%{http_code}" --max-time "${max}")
            if [ -n "${HF_TOKEN:-}" ]; then
              c+=(-H "Authorization: Bearer ${HF_TOKEN}")
            fi
            c+=("${url}")
            local code
            code="$("${c[@]}" || true)"
            if [ -z "${code}" ]; then echo "000"; else echo "${code}"; fi
          }

          bridge_json_ok() {
            python3 -c "
          import json, sys
          p = sys.argv[1]
          with open(p, 'rb') as f:
              raw = f.read(8000)
          if raw.lstrip().startswith(b'<'):
              sys.exit(1)
          d = json.loads(raw.decode())
          sys.exit(0 if d.get('status') == 'ok' else 1)
          " "$1" 2>/dev/null
          }

          echo "Pinging ${HEALTH_URL} ..."

          HTTP_CODE="$(space_get /tmp/health.json 30 "${HEALTH_URL}")"

          if [ "${HTTP_CODE}" = "200" ] && bridge_json_ok /tmp/health.json; then
            echo "Health check passed (HTTP ${HTTP_CODE} /health)"
            python3 -m json.tool /tmp/health.json 2>/dev/null || cat /tmp/health.json
          elif [ "${HTTP_CODE}" != "200" ]; then
            warn_hf_404 "${HTTP_CODE}" /tmp/health.json
            echo "Trying ${ROOT_URL} (GET /) ..."
            HTTP_ROOT="$(space_get /tmp/root.json 30 "${ROOT_URL}")"
            if [ "${HTTP_ROOT}" = "200" ] && bridge_json_ok /tmp/root.json; then
              echo "Space responded OK on / (HTTP 200); /health was ${HTTP_CODE}"
              python3 -m json.tool /tmp/root.json 2>/dev/null || cat /tmp/root.json
            else
              warn_hf_404 "${HTTP_ROOT}" /tmp/root.json
              echo "First attempt not OK (/health HTTP ${HTTP_CODE}, / HTTP ${HTTP_ROOT}) — retrying once after 10s ..."
              cat /tmp/health.json 2>/dev/null | head -c 400 || true
              echo ""
              sleep 10
              HTTP_CODE2="$(space_get /tmp/health2.json 120 "${HEALTH_URL}")"
              if [ "${HTTP_CODE2}" = "200" ] && bridge_json_ok /tmp/health2.json; then
                echo "Retry passed (HTTP ${HTTP_CODE2} /health)"
                python3 -m json.tool /tmp/health2.json 2>/dev/null || cat /tmp/health2.json
              else
                HTTP_ROOT2="$(space_get /tmp/root2.json 120 "${ROOT_URL}")"
                if [ "${HTTP_ROOT2}" = "200" ] && bridge_json_ok /tmp/root2.json; then
                  echo "Retry passed on / (HTTP ${HTTP_ROOT2})"
                  python3 -m json.tool /tmp/root2.json 2>/dev/null || cat /tmp/root2.json
                else
                  warn_hf_404 "${HTTP_CODE2}" /tmp/health2.json
                  echo "::error::Health check failed after retry (/health HTTP ${HTTP_CODE2}, / HTTP ${HTTP_ROOT2}). Set HF_SPACE_URL and, for private Spaces, HF_TOKEN."
                  exit 1
                fi
              fi
            fi
          else
            echo "::error::Unexpected /health response (HTTP ${HTTP_CODE}) — body is not bridge JSON."
            cat /tmp/health.json 2>/dev/null | head -c 2000 || true
            exit 1
          fi

          echo ""
          echo "Adapter status (debug):"
          if [ -z "${MT_BRIDGE_SECRET:-}" ]; then
            echo "  (skipped — set MT_BRIDGE_SECRET to probe /debug/mt5)"
          else
            debug_curl=(curl -sS --max-time 30)
            if [ -n "${HF_TOKEN:-}" ]; then
              debug_curl+=(-H "Authorization: Bearer ${HF_TOKEN}")
            fi
            debug_curl+=(-H "X-Bridge-Secret: ${MT_BRIDGE_SECRET}")
            debug_curl+=("${DEBUG_URL}")
            if ! "${debug_curl[@]}" 2>/dev/null | python3 -c "
          import sys, json
          try:
              raw = sys.stdin.read()
              if not raw.strip():
                  print('  (empty response)')
                  sys.exit(0)
              d = json.loads(raw)
              a = d.get('adapter', {})
              b = d.get('bootstrap', {})
              print(f\"  connected:  {a.get('connected')}\")
              print(f\"  backend:    {a.get('backend')}\")
              print(f\"  ipc_ready:  {b.get('ipc_ready')}\")
              print(f\"  error:      {a.get('last_error', 'none')}\")
          except Exception as e:
              print(f'  (parse error: {e})')
          "; then
              echo "  (debug request failed)"
            fi
          fi
