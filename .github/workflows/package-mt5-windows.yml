name: Package MT5 Portable Archive (Windows)
# Runs on a native Windows GHA runner to install MetaTrader 5 and create
# a portable ZIP archive. The resulting archive is then used by the Linux
# Docker build (via 7z extraction into the Wine prefix), completely bypassing
# the Wine WinHTTP incompatibility that prevents the installer from running
# under Wine.
#
# CRITICAL: The terminal build MUST match the latest MetaTrader5 Python package
# on PyPI. If they don't match, mt5.initialize() returns -10005 (IPC timeout)
# under Wine because the IPC protocol version is incompatible.
#
# USAGE: Run this workflow once. After it completes, copy the release asset
# URL into the main build-mt5-base.yml workflow's mt5_url input.

on:
  workflow_dispatch:
    inputs:
      mt5_url:
        description: "MT5 installer URL (MetaQuotes default or broker-specific like Exness)"
        required: false
        default: "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
      release_tag:
        description: "Release tag (e.g. mt5-portable-5735)"
        required: false
        default: "mt5-portable-latest"
      force_build:
        description: "Create release even if builds don't match PyPI (true/false)"
        required: false
        default: "false"

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MT5 installer
        shell: bash
        run: |
          set -eux
          curl -fsSL --max-time 300 \
            "${{ github.event.inputs.mt5_url }}" \
            -o mt5setup.exe
          du -sh mt5setup.exe

      - name: Run MT5 installer silently
        shell: powershell
        run: |
          Write-Host "Starting MT5 installer with /auto flag..."
          # Use Start-Process -Wait so we get the desktop session context.
          # Don't throw on non-zero exit: the stub may return 1 even on success.
          $proc = Start-Process -FilePath "$env:GITHUB_WORKSPACE\mt5setup.exe" `
                                -ArgumentList "/auto" `
                                -PassThru `
                                -Wait
          Write-Host "Installer exited with code: $($proc.ExitCode)"
          Write-Host "=== C:\Program Files after installer ==="
          Get-ChildItem "C:\Program Files\" -ErrorAction SilentlyContinue | Format-Table Name
          Write-Host "=== AppData\Roaming ==="
          Get-ChildItem "$env:APPDATA\" -ErrorAction SilentlyContinue | Format-Table Name

      - name: Poll until terminal64.exe appears (up to 10 min)
        shell: bash
        run: |
          set -eux
          FOUND=false
          for n in $(seq 1 120); do
            if [ -f "C:/Program Files/MetaTrader 5/terminal64.exe" ]; then
              echo "terminal64.exe found after ${n} poll(s)!"
              FOUND=true
              break
            fi
            echo "Waiting for installation... attempt ${n}/120"
            sleep 5
          done
          if [ "${FOUND}" != "true" ]; then
            echo "ERROR: terminal64.exe was not found after 10 minutes."
            ls "C:/Program Files/" || true
            exit 1
          fi

      - name: Print installed MT5 version
        id: mt5_ver
        shell: powershell
        run: |
          $f      = "C:\Program Files\MetaTrader 5\terminal64.exe"
          $v      = (Get-Item $f).VersionInfo.FileVersion
          $build  = $v -replace '[^0-9]', ''
          Write-Host "MT5 version: $v  build: $build"
          "build=$build"    | Out-File $env:GITHUB_OUTPUT -Append
          "tag=mt5-portable-$build" | Out-File $env:GITHUB_OUTPUT -Append

      # ── NEW: Check PyPI for matching MetaTrader5 Python package ──────────
      - name: Check PyPI for matching MetaTrader5 package
        id: pypi_check
        shell: powershell
        run: |
          $build = "${{ steps.mt5_ver.outputs.build }}"
          $targetPkg = "MetaTrader5==$( '5.0.' + $build )"
          Write-Host "Terminal build: $build"
          Write-Host "Looking for PyPI package: $targetPkg"

          # Try to install the exact matching version
          $exactMatch = $false
          try {
            pip install $targetPkg --quiet 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "SUCCESS: Exact match $targetPkg found on PyPI!"
              $exactMatch = $true
            }
          } catch {}

          if (-not $exactMatch) {
            Write-Host "WARNING: $targetPkg NOT found on PyPI."
            Write-Host "Installing latest MetaTrader5 package instead..."
            pip install MetaTrader5 --quiet
            $installed = pip show MetaTrader5 | Select-String "Version:"
            Write-Host "Latest PyPI version: $installed"

            # Extract the build number from the installed package version
            $pkgVer = ($installed -replace 'Version:\s*', '').Trim()
            $pkgBuild = ($pkgVer -split '\.')[-1]
            Write-Host "Package build: $pkgBuild vs Terminal build: $build"

            if ($pkgBuild -ne $build) {
              Write-Host ""
              Write-Host "##[error] BUILD MISMATCH DETECTED!"
              Write-Host "##[error] Terminal: $build  |  PyPI package: $pkgBuild"
              Write-Host "##[error] mt5.initialize() will return -10005 under Wine."
              Write-Host ""
              if ("${{ github.event.inputs.force_build }}" -ne "true") {
                Write-Host "Set force_build=true to create the release anyway."
                "match=false" | Out-File $env:GITHUB_OUTPUT -Append
                "pkg_build=$pkgBuild" | Out-File $env:GITHUB_OUTPUT -Append
                exit 1
              } else {
                Write-Host "force_build=true — continuing despite mismatch."
              }
            }
            "pkg_build=$pkgBuild" | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            "pkg_build=$build" | Out-File $env:GITHUB_OUTPUT -Append
          }
          "match=true" | Out-File $env:GITHUB_OUTPUT -Append

      # ── NEW: Verify IPC works on native Windows ──────────────────────────
      - name: Verify IPC on native Windows
        if: steps.pypi_check.outputs.match == 'true' || github.event.inputs.force_build == 'true'
        shell: powershell
        run: |
          Write-Host "Starting terminal for IPC verification..."
          $term = Start-Process -FilePath "C:\Program Files\MetaTrader 5\terminal64.exe" `
                                -PassThru
          Write-Host "Terminal PID: $($term.Id)"
          Start-Sleep -Seconds 30

          Write-Host "Testing mt5.initialize()..."
          python -c @"
          import MetaTrader5 as mt5
          ok = mt5.initialize(path=r'C:\Program Files\MetaTrader 5\terminal64.exe', timeout=30000)
          print(f'initialize() = {ok}')
          if ok:
              info = mt5.terminal_info()
              print(f'Terminal: build {info.build}, name={info.name}')
              ver = mt5.version()
              print(f'Version tuple: {ver}')
              mt5.shutdown()
          else:
              err = mt5.last_error()
              print(f'Error: {err}')
              # Don't fail — IPC may need manual login on first run
          "@

          # Kill terminal
          Stop-Process -Id $term.Id -Force -ErrorAction SilentlyContinue
          Write-Host "IPC verification complete."

      - name: Create portable ZIP archive
        shell: bash
        run: |
          set -eux
          cd "C:/Program Files"
          ls "MetaTrader 5/"
          7z a "$GITHUB_WORKSPACE/mt5_v5430.zip" "MetaTrader 5" -mx=5
          du -sh "$GITHUB_WORKSPACE/mt5_v5430.zip"

      - name: Upload to GitHub Releases
        if: steps.pypi_check.outputs.match == 'true' || github.event.inputs.force_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG="${{ steps.mt5_ver.outputs.tag }}"
          BUILD="${{ steps.mt5_ver.outputs.build }}"
          PKG_BUILD="${{ steps.pypi_check.outputs.pkg_build }}"

          NOTES="MetaTrader 5 portable archive (Windows GHA, $(date -u +%Y-%m-%d)).
          Terminal build: ${BUILD}
          PyPI package build: ${PKG_BUILD}
          Match: ${{ steps.pypi_check.outputs.match }}

          Use this URL as mt5_url in the build-mt5-base workflow:
          https://github.com/${{ github.repository }}/releases/download/${TAG}/mt5_v5430.zip"

          # Create or update the release
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists — uploading asset..."
          else
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" \
              --title "MT5 Portable Build ${BUILD}" \
              --notes "${NOTES}"
          fi
          gh release upload "${TAG}" \
            "$GITHUB_WORKSPACE/mt5_v5430.zip" \
            --clobber
          echo ""
          echo "=== Use this URL in build-mt5-base.yml ==="
          echo "https://github.com/${{ github.repository }}/releases/download/${TAG}/mt5_v5430.zip"
