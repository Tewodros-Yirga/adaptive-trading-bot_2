# Keep HuggingFace Space awake by pinging the health endpoint every 14 minutes.
# HF Spaces sleep after a period of inactivity (typically 48h for free tier,
# configurable for paid). This cron job ensures continuous uptime for the
# MT5 bridge service.
name: Keep MT5 Bridge Alive

on:
  schedule:
    # Every 14 minutes (GitHub Actions cron minimum granularity is 5 min,
    # but HF needs a hit at least every ~30 min to avoid sleep).
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        env:
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL || 'https://loriloha-mt5-bridge-service.hf.space' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          HEALTH_URL="${HF_SPACE_URL}/health"
          DEBUG_URL="${HF_SPACE_URL}/debug/mt5"

          echo "🏓 Pinging ${HEALTH_URL} ..."

          # Build auth header if token is available
          AUTH_HEADER=""
          if [ -n "${HF_TOKEN:-}" ]; then
            AUTH_HEADER="-H \"Authorization: Bearer ${HF_TOKEN}\""
          fi

          # Ping health endpoint (wakes up the Space if sleeping)
          HTTP_CODE=$(eval curl -s -o /tmp/health.json -w '%{http_code}' \
            --max-time 30 \
            ${AUTH_HEADER} \
            "${HEALTH_URL}" || echo "000")

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✅ Health check passed (HTTP ${HTTP_CODE})"
            cat /tmp/health.json | python3 -m json.tool 2>/dev/null || cat /tmp/health.json
          elif [ "${HTTP_CODE}" = "000" ]; then
            echo "⚠️ Connection timeout — Space may be cold-starting"
            # Retry once with longer timeout (Space may need to boot)
            sleep 10
            HTTP_CODE2=$(eval curl -s -o /tmp/health2.json -w '%{http_code}' \
              --max-time 120 \
              ${AUTH_HEADER} \
              "${HEALTH_URL}" || echo "000")
            echo "Retry result: HTTP ${HTTP_CODE2}"
            cat /tmp/health2.json 2>/dev/null || true
          else
            echo "❌ Health check failed (HTTP ${HTTP_CODE})"
            cat /tmp/health.json 2>/dev/null || true
          fi

          # Quick adapter status check
          echo ""
          echo "📊 Adapter status:"
          eval curl -s --max-time 15 \
            ${AUTH_HEADER} \
            "${DEBUG_URL}" 2>/dev/null \
            | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              a = d.get('adapter', {})
              b = d.get('bootstrap', {})
              print(f\"  connected:  {a.get('connected')}\")
              print(f\"  backend:    {a.get('backend')}\")
              print(f\"  ipc_ready:  {b.get('ipc_ready')}\")
              print(f\"  error:      {a.get('last_error', 'none')}\")
          except Exception as e:
              print(f'  (parse error: {e})')
          " || echo "  (endpoint unreachable)"
