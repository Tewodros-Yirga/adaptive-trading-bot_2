[supervisord]
nodaemon=true
loglevel=info
logfile=/tmp/supervisor/supervisord.log
pidfile=/tmp/supervisor/supervisord.pid
childlogdir=/tmp/supervisor

[program:bootstrap-mt5]
command=/bin/bash -lc "/bridge/bootstrap-mt5.sh"
environment=DISPLAY=":99"
autostart=true
autorestart=false
startsecs=0
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mt5]
command=/bin/bash -lc "WINE_CMD=''; if command -v wine >/dev/null 2>&1; then WINE_CMD='wine'; elif command -v wine64 >/dev/null 2>&1; then WINE_CMD='wine64'; fi; if [ -z \"$WINE_CMD\" ]; then echo 'Wine command not found (wine/wine64)'; sleep 600; exit 0; fi; if [ -f \"$MT_TERMINAL_EXE\" ]; then \"$WINE_CMD\" \"$MT_TERMINAL_EXE\"; else echo 'MT terminal exe not found at '$MT_TERMINAL_EXE; sleep 600; fi"
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bridge-api]
command=/bin/bash -lc "uvicorn app.main:app --host 0.0.0.0 --port ${BRIDGE_PORT:-5555}"
autostart=true
autorestart=true
startsecs=1
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
