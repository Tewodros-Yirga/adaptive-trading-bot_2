[supervisord]
nodaemon=true
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x720x24
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mt5]
command=/bin/bash -lc "if [ -f \"$MT_TERMINAL_EXE\" ]; then wine \"$MT_TERMINAL_EXE\"; else echo 'MT terminal exe not found at '$MT_TERMINAL_EXE; sleep 600; fi"
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bridge-api]
command=/bin/bash -lc "uvicorn app.main:app --host 0.0.0.0 --port ${BRIDGE_PORT:-5555}"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
